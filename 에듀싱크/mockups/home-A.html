<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시안 A — 오늘 한 장</title>
<!-- ═══════════════════════════════════════════════════════════
     홈 시안 A 「오늘 한 장」 (2026-08-02)
     · 실제 앱 코드가 아니다. mockups/ 안에서만 돈다.
     · 데이터는 학기 중 하루로 채웠다(방학이면 급식·시간표가 비어 시안 비교가 안 된다).
     · 아이 이름·학교는 가짜다.
     ═══════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="../app/www/fonts/tabler-subset.css">
<style>
/* ── 토큰 ────────────────────────────────────────────────
   테마 6변수 구조를 그대로 지킨다. 나머지 색은 전부 여기서 파생시킨다.
   방향: 학교 공문·가정통신문의 모조지. 칠판 초록을 강조로 쓴다. */
:root{
  --bg:#E8EAE6; --card:#FDFDFC; --ink:#1D2119; --muted:#5B6155; --line:#D2D6CD;
  --accent:#2F5D3A;

  --hair:color-mix(in srgb, var(--ink) 18%, var(--bg));
  --on-accent:#fff;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:40px;
  --frame:420px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  background:#C9CCC7; color:var(--ink);
  font-size:15px; line-height:1.5;
  font-feature-settings:"tnum" 0;
}
#app{max-width:var(--frame);min-height:100vh;margin:0 auto;background:var(--bg);
  padding:0 var(--sp4) 96px;position:relative}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ── 상단 ─────────────────────────────────────────────── */
.top{display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp3) 0 var(--sp2);position:sticky;top:0;background:var(--bg);z-index:5}
.kid{display:flex;align-items:center;gap:var(--sp2);font-weight:700}
.kid .face{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.kid i{font-size:14px;color:var(--muted)}
.top .set{font-size:13px;color:var(--muted)}

/* ── 날짜 — 화면에 큰 글씨는 여기 하나뿐 ─────────────── */
.date{padding:var(--sp5) 0 var(--sp2);display:flex;align-items:baseline;gap:var(--sp2)}
.date .d{font-size:52px;font-weight:800;letter-spacing:-.045em;line-height:.9;font-variant-numeric:tabular-nums}
.date .m{font-size:17px;font-weight:700;color:var(--muted)}
.date .w{font-size:17px;font-weight:700;color:var(--muted);margin-left:auto}
.lede{display:flex;align-items:center;gap:var(--sp2);padding-bottom:var(--sp5);
  border-bottom:1px solid var(--line)}
.lede b{font-size:15px;font-weight:700}
.lede .dd{font-size:12.5px;font-weight:800;color:var(--on-accent);background:var(--accent);
  padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums;flex:none}

/* ── 시그니처: 하루의 세로 시간축 ────────────────────────
   왼쪽 눈금이 곧 오늘의 길이다. 급식은 점심 높이에, 준비물은 저녁 높이에 걸린다. */
.day{margin-top:var(--sp5);margin-bottom:var(--sp5)}
.slot{display:grid;grid-template-columns:46px minmax(0,1fr);gap:0 var(--sp4);position:relative}
.slot .t{font-size:12.5px;font-weight:700;color:var(--muted);text-align:right;
  font-variant-numeric:tabular-nums;padding-top:1px;position:relative}
/* 눈금선 — 시각 칸 오른쪽에 머리카락 한 줄. 마지막 칸은 아래로 안 뻗는다. */
.slot .t::after{content:"";position:absolute;right:calc(var(--sp4) / -2 - .5px);top:6px;bottom:-2px;
  width:1px;background:var(--hair)}
/* 마지막 칸은 선이 아래로 흘러내리면 안 된다 — 하루가 끝나는 지점에서 멈춘다.
   아래 여백을 .c 가 아니라 .day 가 갖게 해서 «선 = 내용 높이» 가 되게 맞췄다. */
.slot:last-child .c{padding-bottom:0}
.slot:last-child .t::after{bottom:0}
.slot .t::before{content:"";position:absolute;right:calc(var(--sp4) / -2 - 2.5px);top:5px;
  width:5px;height:5px;border-radius:50%;background:var(--hair)}
.slot.now .t{color:var(--accent)}
.slot.now .t::before{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,var(--bg))}
.slot .c{padding-bottom:var(--sp5);min-width:0}
.slot h3{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:var(--sp1)}

/* 교시 — 여섯 칸이 오늘의 수업이다 */
.periods{display:flex;flex-wrap:wrap;gap:var(--sp1)}
.periods span{font-size:13.5px;font-weight:700;padding:3px 8px;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
.periods span.free{color:var(--muted);font-weight:400}
/* 급식 — 이 화면에서 가장 자주 읽히는 글이라 본문 크기를 준다 */
.menu{font-size:15px;line-height:1.65}
.menu b{font-weight:700}
.menu .rest{color:var(--muted)}
.one{font-size:15px}
.one .sub{color:var(--muted);font-size:13px}
/* 준비물 — 체크칸이 있어야 «챙긴다»는 동사가 된다 */
.pack{display:flex;flex-direction:column;gap:var(--sp2)}
.pack label{display:flex;align-items:center;gap:var(--sp2);font-size:15px}
.pack i.box{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;flex:none}

/* ── 광고 ─────────────────────────────────────────────── */
.ad{margin:var(--sp2) 0 var(--sp5);height:76px;border:1px dashed var(--line);border-radius:10px;
  display:grid;place-items:center;color:var(--muted);font-size:12.5px;background:var(--card)}

/* ── 오늘 밖의 것 — 오늘이 아닌 것은 한 줄로 내린다 ──── */
.beyond{border-top:1px solid var(--line);padding-top:var(--sp4)}
.beyond h3{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:var(--sp3)}
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp2)}
.rail button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:var(--sp2) var(--sp2) var(--sp3);border-radius:10px;min-width:0}
.rail i{font-size:19px;color:var(--muted)}
.rail .n{font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.rail .n.on{color:var(--accent)}
.rail .l{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rail button:active{background:var(--card)}

/* 다가오는 일정 — 오늘 밖이지만 부모가 미리 알아야 하는 것 */
.soon{margin-top:var(--sp5)}
.soon h3{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:var(--sp2)}
.soon button{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;
  gap:var(--sp3);width:100%;padding:var(--sp3) 0;border-bottom:1px solid var(--line)}
.soon button:last-child{border-bottom:0}
.soon .d{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.soon .n{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soon .dd{font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}

/* ── 하단 대화창 (유지 제약) ──────────────────────────── */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:var(--frame);
  display:flex;align-items:center;gap:var(--sp2);padding:var(--sp3) var(--sp4);
  background:var(--card);border-top:1px solid var(--line)}
.dock .f{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.dock .m{flex:1;min-width:0;font-size:13.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock .b{flex:none;font-size:12px;font-weight:800;color:var(--on-accent);background:var(--accent);
  border-radius:999px;padding:1px 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <div class="top">
    <button class="kid"><span class="face">하</span>하늘<i class="ti ti-chevron-down"></i></button>
    <button class="set">설정</button>
  </div>

  <div class="date">
    <span class="d">14</span><span class="m">10월</span><span class="w">화요일</span>
  </div>
  <div class="lede">
    <b>가을 현장체험학습</b><span class="dd">D-3</span>
  </div>

  <div class="day">
    <div class="slot">
      <div class="t">08:40</div>
      <div class="c">
        <h3>수업</h3>
        <div class="periods">
          <span>국어</span><span>수학</span><span>통합</span><span>통합</span><span class="free">창체</span>
        </div>
      </div>
    </div>

    <div class="slot now">
      <div class="t">12:20</div>
      <div class="c">
        <h3>급식</h3>
        <div class="menu">
          <b>기장밥 · 쇠고기무국</b><br>
          <span class="rest">돈육김치볶음 · 알감자조림 · 배추김치</span>
        </div>
      </div>
    </div>

    <div class="slot">
      <div class="t">15:30</div>
      <div class="c">
        <h3>방과후</h3>
        <div class="one">축구교실 <span class="sub">· 운동장</span></div>
      </div>
    </div>

    <div class="slot">
      <div class="t">저녁</div>
      <div class="c">
        <h3>내일 챙길 것</h3>
        <div class="pack">
          <label><i class="box"></i>리코더</label>
          <label><i class="box"></i>물감세트</label>
        </div>
      </div>
    </div>
  </div>

  <div class="ad">광고</div>

  <div class="beyond">
    <h3>오늘 밖</h3>
    <div class="rail">
      <button><span class="n on">2<small>/3</small></span><span class="l">미션</span></button>
      <button><span class="n">42</span><span class="l">서랍</span></button>
      <button><span class="n on">2</span><span class="l">알림</span></button>
      <button><i class="ti ti-file-text"></i><span class="l">서식</span></button>
    </div>

    <div class="soon">
      <h3>다가오는 일정</h3>
      <button><span class="d">10.17</span><span class="n">가을 현장체험학습</span><span class="dd">D-3</span></button>
      <button><span class="d">10.24</span><span class="n">학부모 공개수업</span><span class="dd">D-10</span></button>
      <button><span class="d">11.3</span><span class="n">2학기 중간평가</span><span class="dd">D-20</span></button>
    </div>
  </div>

</div>

<div class="dock">
  <span class="f">하</span>
  <span class="m">엄마 오늘 축구 끝나고 데리러 와?</span>
  <span class="b">1</span>
</div>
</body>
</html>
