/* ── 라이트 ──────────────────────────────────────────────
   ⚠ 색을 고를 때 «칠하는 색»과 «그 색으로 쓰는 글씨»를 나눠 둔다.
     점·뱃지처럼 면을 칠할 땐 쨍한 값이 좋지만, 같은 값으로 12~13px 글씨를 쓰면
     연회색 카드 위에서 대비가 4.5:1 아래로 떨어진다(감사 2026-08-02에서 4건 적발).
     그래서 -ink 짝을 따로 둔다. 다크에선 둘이 같은 값이어도 통과한다. */
:root{
  color-scheme:light;
  --bg:#FFFFFF;        /* 바탕 */
  --card:#F2F4F6;      /* 보조 바탕 — 카드·격자칸·광고 */
  --ink:#191F28;
  --muted:#5F6B7A;     /* 보조 글씨 — 카드 위 4.9:1 */
  --line:#E5E8EB;
  --accent:#2F6BEA;    /* 포인트 — 칠하는 값 */
  --accent-ink:#2B62D6;/* 포인트로 쓰는 글씨 — 카드 위 5.0:1 */
  --on-accent:#FFFFFF; /* 포인트 면 위 글씨 */

  --icon:#4E5968;      /* 아이콘 기본 회색 — 상태가 없으면 전부 이 색 */
  --chip:#FFFFFF;      /* 아이콘 칸 바탕 (연회색 카드 위에 흰 원) */
  --outer:#DDE1E6;     /* 앱 프레임 바깥 — 폰에선 안 보인다 */

  /* 기능색 — 뜻이 있을 때만 */
  --todo:#E5484D;      /* 해야 할 일 · 미확인 — 점·표시등 면 */
  --todo-ink:#C2262B;  /* 같은 뜻의 글씨·뱃지 면 — 카드 위 5.3:1 */
  --done:#17A34A;      /* 완료 — 면 */
  --done-ink:#0F7A37;  /* 완료 글씨·체크 면 — 카드 위 4.9:1 */
  --on-fn:#FFFFFF;     /* 기능색 면 위에 얹는 글씨 */

  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:28px;
  --frame:420px; --tabh:64px;
}
/* ── 다크 ──────────────────────────────────────────────
   배경을 검정에 붙이지 않는다 — 카드를 올려 깊이를 만든다.
   기능색은 어두운 바탕에서 묻히므로 밝은 한 벌을 따로 잡고, 그 위 글씨는 어둡게 뒤집는다. */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16181D; --card:#212530; --ink:#EEF1F5; --muted:#98A1AE; --line:#2C313B;
  --accent:#5C93FF; --accent-ink:#5C93FF; --on-accent:#101319;
  --icon:#AEB8C6; --chip:#2E3440; --outer:#0A0B0E;
  --todo:#FF6B6E; --todo-ink:#FF6B6E; --done:#42C36F; --done-ink:#42C36F;
  --on-fn:#14161A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  background:var(--outer);color:var(--ink);font-size:15px;line-height:1.45;letter-spacing:-.01em;
}
/* 탭바를 «흐름 안 마지막»에 두고 sticky 로 붙인다.
   position:fixed 로 두면 내용 위에 겹쳐 떠서 격자 마지막 줄을 가렸다(2026-08-02 지적).
   flex + margin-top:auto 라 내용이 짧아도 화면 맨 아래에 앉는다. */
#app{max-width:var(--frame);min-height:100vh;margin:0 auto;background:var(--bg);
  display:flex;flex-direction:column}
#body{flex:1;padding:0 var(--sp4) var(--sp5)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px}

/* ── 상단 ─────────────────────────────────────────────── */
.top{display:flex;align-items:center;justify-content:space-between;height:56px}
.who{display:flex;align-items:center;gap:var(--sp2);min-height:44px;padding-right:var(--sp2)}
.who .face{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  flex:none;display:grid;place-items:center;font-size:15px;font-weight:800}
.who b{font-size:17px;font-weight:800}
.who i{font-size:16px;color:var(--muted)}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;font-size:24px;
  color:var(--icon)}
.badge{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--todo-ink);color:var(--on-fn);font-size:11px;font-weight:800;
  display:grid;place-items:center;border:2px solid var(--bg);font-variant-numeric:tabular-nums}

/* ── D-day 한 줄 — 이 화면의 유일한 파랑 정보 ─────────── */
.dday{display:flex;align-items:center;gap:var(--sp3);width:100%;min-height:52px;
  padding:0 var(--sp4);border-radius:14px;background:var(--card);margin-bottom:var(--sp5)}
.dday i.ti{font-size:20px;color:var(--icon);flex:none}
.dday .n{flex:1;min-width:0;font-size:15px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dday .v{flex:none;font-size:14px;font-weight:800;color:var(--accent-ink);font-variant-numeric:tabular-nums}

/* ── 오늘의 큰 카드 3장 ───────────────────────────────── */
.big{display:flex;flex-direction:column;gap:var(--sp3);margin-bottom:var(--sp5)}
.bcard{display:grid;grid-template-columns:52px minmax(0,1fr) 20px;align-items:center;
  gap:var(--sp4);width:100%;min-height:96px;padding:var(--sp4);border-radius:20px;background:var(--card)}
.bcard:active{background:color-mix(in srgb,var(--ink) 8%,var(--card))}
.bcard .ic{width:52px;height:52px;border-radius:50%;background:var(--chip);color:var(--icon);
  display:grid;place-items:center;font-size:24px;position:relative}
.bcard .tx{min-width:0}
.bcard .lb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);
  margin-bottom:3px}
.bcard .ttl{font-size:17px;font-weight:800;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .sub{font-size:13.5px;color:var(--muted);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .go{font-size:20px;color:var(--muted);justify-self:end}

/* 상태 — 해야 할 일에는 빨강, 끝난 것에는 초록. 그 밖엔 색을 쓰지 않는다 */
.dot{width:7px;height:7px;border-radius:50%;background:var(--todo);flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;
  padding:3px 9px;border-radius:999px;color:var(--todo-ink);
  background:color-mix(in srgb,var(--todo) 12%,var(--card))}
.st{position:absolute;top:-2px;right:-2px;width:15px;height:15px;border-radius:50%;
  border:2.5px solid var(--card)}
.st.todo{background:var(--todo)}
.st.done{background:var(--done-ink);display:grid;place-items:center;color:var(--on-fn);font-size:10px}

/* ── 광고 ─────────────────────────────────────────────── */
.ad{height:80px;border-radius:16px;background:var(--card);display:grid;place-items:center;
  color:var(--muted);font-size:12.5px;margin-bottom:var(--sp6)}

/* ── 전체 격자 (E에서 가져옴) — 아이콘 + 이름 + 숫자 ──── */
.gtitle{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:var(--sp3)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp3)}
.gitem{display:flex;flex-direction:column;align-items:center;gap:var(--sp2);min-width:0;
  padding:var(--sp4) var(--sp2);border-radius:18px;background:var(--card)}
.gitem:active{background:color-mix(in srgb,var(--ink) 8%,var(--card))}
.gitem .ic{position:relative;width:48px;height:48px;border-radius:50%;background:var(--chip);
  color:var(--icon);display:grid;place-items:center;font-size:24px}
.gitem .ic .badge{top:-4px;right:-6px;border-color:var(--card)}
.gitem .nm{font-size:13.5px;font-weight:700;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem .cnt{font-size:12.5px;color:var(--muted);margin-top:-4px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gitem .cnt.todo{color:var(--todo-ink);font-weight:700}
.gitem .cnt.done{color:var(--done-ink);font-weight:700}

/* ── 하단 고정 탭바 — 하나뿐이다 ──────────────────────── */
.tabs{position:sticky;bottom:0;margin-top:auto;height:var(--tabh);
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--bg);border-top:1px solid var(--line)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;position:relative}
.tabs a i{font-size:24px}
.tabs a.on{color:var(--accent-ink)}
.tabs a .badge{top:9px;right:calc(50% - 20px);border-color:var(--bg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="body">

    <div class="top">
      <button class="who"><span class="face">하</span><b>하늘</b><i aria-hidden="true" class="ti ti-chevron-down"></i></button>
      <button class="bell" aria-label="알림 2개"><i aria-hidden="true" class="ti ti-bell"></i><span class="badge">2</span></button>
    </div>

    <button class="dday">
      <i aria-hidden="true" class="ti ti-calendar"></i>
      <span class="n">가을 현장체험학습</span>
      <span class="v">D-3</span>
    </button>

    <div class="big">
      <button class="bcard">
        <span class="ic"><i aria-hidden="true" class="ti ti-tools-kitchen-2"></i></span>
        <span class="tx">
          <span class="lb">오늘 급식 · 12:20</span>
          <span class="ttl">기장밥 · 쇠고기무국</span>
          <span class="sub">돈육김치볶음 · 알감자조림 · 배추김치</span>
        </span>
        <i aria-hidden="true" class="ti ti-chevron-right go"></i>
      </button>

      <button class="bcard">
        <span class="ic"><i aria-hidden="true" class="ti ti-run"></i></span>
        <span class="tx">
          <span class="lb">하교 · 방과후</span>
          <span class="ttl">13:40 하교 → 축구교실</span>
          <span class="sub">15:30 운동장 · 오늘 5교시</span>
        </span>
        <i aria-hidden="true" class="ti ti-chevron-right go"></i>
      </button>

      <button class="bcard">
        <span class="ic"><i aria-hidden="true" class="ti ti-backpack"></i><span class="st todo"></span></span>
        <span class="tx">
          <span class="lb"><span class="dot"></span>내일 챙길 것 2개</span>
          <span class="ttl">리코더 · 물감세트</span>
          <span class="sub"><span class="pill">아직 안 챙김</span></span>
        </span>
        <i aria-hidden="true" class="ti ti-chevron-right go"></i>
      </button>
    </div>

    <div class="ad">광고</div>

    <div class="gtitle">전체</div>
    <div class="grid">
      <button class="gitem">
        <span class="ic"><i aria-hidden="true" class="ti ti-target"></i><span class="st todo"></span></span>
        <span class="nm">미션</span><span class="cnt todo">1개 남음</span>
      </button>
      <button class="gitem">
        <span class="ic"><i aria-hidden="true" class="ti ti-photo"></i></span>
        <span class="nm">서랍</span><span class="cnt">42장</span>
      </button>
      <button class="gitem">
        <span class="ic"><i aria-hidden="true" class="ti ti-bell"></i><span class="badge">2</span></span>
        <span class="nm">알림</span><span class="cnt todo">안 읽음 2</span>
      </button>
      <button class="gitem">
        <span class="ic"><i aria-hidden="true" class="ti ti-table"></i></span>
        <span class="nm">시간표</span><span class="cnt">오늘 5교시</span>
      </button>
      <button class="gitem">
        <span class="ic"><i aria-hidden="true" class="ti ti-calendar"></i></span>
        <span class="nm">일정</span><span class="cnt">3건</span>
      </button>
      <button class="gitem">
        <span class="ic"><i aria-hidden="true" class="ti ti-file-text"></i><span class="st done"><i aria-hidden="true" class="ti ti-check"></i></span></span>
        <span class="nm">서식</span><span class="cnt done">낼 것 없음</span>
      </button>
      <button class="gitem">
        <span class="ic"><i aria-hidden="true" class="ti ti-run"></i></span>
        <span class="nm">방과후</span><span class="cnt">주 3회</span>
      </button>
      <button class="gitem">
        <span class="ic"><i aria-hidden="true" class="ti ti-messages"></i></span>
        <span class="nm">커뮤니티</span><span class="cnt">3학년</span>
      </button>
      <button class="gitem">
        <span class="ic"><i aria-hidden="true" class="ti ti-school"></i></span>
        <span class="nm">학교정보</span><span class="cnt">나래초</span>
      </button>
    </div>

  </div>

  <nav class="tabs">
    <a href="#" class="on" aria-current="page"><i aria-hidden="true" class="ti ti-home"></i>홈</a>
    <a href="#"><i aria-hidden="true" class="ti ti-photo"></i>서랍</a>
    <a href="#"><i aria-hidden="true" class="ti ti-target"></i>미션</a>
    <a href="#"><i aria-hidden="true" class="ti ti-file-text"></i>서식</a>
    <a href="#"><i aria-hidden="true" class="ti ti-user"></i>설정</a>
  </nav>
</div>
</body>
</html>
