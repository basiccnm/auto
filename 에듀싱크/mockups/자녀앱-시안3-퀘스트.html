<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>자녀 앱 시안 ③ 퀘스트 보드</title>
<!-- 시안 ③ — 도장판을 게임 퀘스트판처럼. 진한 남색 판 + 금별.
     마스코트 없이 별·배지·경로만으로 게임감을 낸다.
     포인트 3종(금/네온민트/핑크) 중 「금」 고른 상태. -->
<link rel="stylesheet" href="../app/www/fonts/tabler-subset.css">
<style>
:root{
  --k:#FFC531; --k-deep:#B8860B; --on-k:#241C05;
  --bg:#141A2E; --card:#1F2742; --line:#2C3554; --ink:#F2F4FA; --muted:#93A0C2;
  --done:#3DDC84;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Pretendard","Malgun Gothic",sans-serif;background:#0A0D18;
  display:flex;gap:12px;padding:12px;color:var(--ink)}
.ph{width:360px;height:800px;background:var(--bg);border-radius:28px;overflow:hidden;
  flex:none;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.cap{font-size:12px;font-weight:800;color:#ddd;padding:0 2px 6px}
.body{flex:1;padding:22px 20px;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;border:0;cursor:pointer}
h1{font-size:27px;font-weight:900;letter-spacing:-.02em}
.sub{font-size:15px;color:var(--muted);font-weight:700;margin-top:4px}

.lv{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;
  padding:12px 16px;margin:16px 0 18px}
.lv .n{width:44px;height:44px;border-radius:50%;background:var(--k);color:var(--on-k);
  display:grid;place-items:center;font-size:19px;font-weight:900;flex:none}
.lv b{font-size:17px;font-weight:900;flex:1}
.lv .bar{position:relative;height:10px;border-radius:5px;background:var(--line);flex:2}
.lv .bar i{position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:5px;background:var(--k)}

.q{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;
  display:flex;align-items:center;gap:14px}
.q .badge{width:52px;height:52px;border-radius:14px;background:#2A3352;color:var(--k);
  display:grid;place-items:center;font-size:26px;flex:none}
.q b{font-size:19px;font-weight:900;flex:1;display:block}
.q .rw{font-size:14px;font-weight:800;color:var(--k)}
.q .go{min-height:50px;padding:0 18px;border-radius:14px;background:var(--k);color:var(--on-k);
  font-size:16px;font-weight:900;flex:none}
.q.clear{border-color:var(--done)}
.q.clear .badge{background:rgba(61,220,132,.15);color:var(--done)}
.q.clear .ok{color:var(--done);font-size:15px;font-weight:900}

/* 축하 — 퀘스트 클리어 연출 자리: 금빛 카드 + CLEAR 도장 */
.hooray{background:linear-gradient(150deg,#2A2410,#4A3A0C);border:2px solid var(--k);border-radius:22px;
  padding:24px 18px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}
.hooray b{font-size:26px;font-weight:900;color:var(--k);display:block;letter-spacing:.04em}
.hooray span{font-size:15px;font-weight:800;color:#D9C98E;display:block;margin-top:4px}
.hooray .stamp{width:80px;height:80px;margin:14px auto 0;border-radius:50%;
  border:5px solid var(--k);color:var(--k);display:grid;place-items:center;
  font-size:22px;font-weight:900;transform:rotate(-8deg);letter-spacing:.05em}
.spark i{position:absolute;font-style:normal;color:var(--k);font-size:18px}
.spark i:nth-child(1){left:12%;top:14%}.spark i:nth-child(2){right:12%;top:18%}
.spark i:nth-child(3){left:20%;bottom:16%;font-size:13px}.spark i:nth-child(4){right:18%;bottom:14%;font-size:13px}

.pickrow{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px}
.pickrow span{font-size:13px;font-weight:800;color:var(--muted)}
.chip{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.chip.c1{background:#FFC531}.chip.c2{background:#3DE8C5}.chip.c3{background:#FF7DAE}
.chip.on{border-color:#fff}

.shot{flex:1;border-radius:22px;background:var(--card);border:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin:16px 0}
.shot .lens{width:110px;height:110px;border-radius:50%;background:var(--k);color:var(--on-k);
  display:grid;place-items:center;font-size:48px}
.shot b{font-size:20px;font-weight:900}
.shot .sub{font-size:14px}
.send{width:100%;min-height:66px;border-radius:18px;background:var(--k);color:var(--on-k);
  font-size:21px;font-weight:900}

/* 퀘스트 지도 — 별이 길을 따라 이어진다 */
.path{flex:1;position:relative;margin-top:14px}
.node{position:absolute;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  font-size:24px;background:var(--card);border:2px dashed var(--line);color:#4A567C}
.node.on{border:3px solid var(--k);color:var(--k);background:#2A2410}
.node.today{border:3px solid #fff;color:#fff;background:var(--k-deep);transform:scale(1.15)}
.node b{position:absolute;bottom:-22px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.trail{position:absolute;border-left:3px dotted var(--line);width:0}
.goalbox{background:var(--card);border:1.5px solid var(--k);border-radius:20px;padding:16px;text-align:center}
.goalbox b{font-size:18px;font-weight:900;color:var(--k)}
.goalbox span{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-top:4px}
</style>
</head>
<body>

<div><div class="cap">① 홈 — 오늘의 퀘스트</div>
<div class="ph"><div class="body">
  <h1>오늘의 퀘스트</h1>
  <div class="lv"><span class="n">37</span><b>모은 별</b><span class="bar"><i></i></span></div>
  <div class="q clear"><span class="badge"><i class="ti ti-check"></i></span><b>방 정리</b><span class="ok">클리어!</span></div>
  <div class="q"><span class="badge"><i class="ti ti-camera"></i></span><span style="flex:1"><b>저녁 양치</b><span class="rw">★1 · 사진 퀘스트</span></span><button class="go">도전</button></div>
  <div class="q"><span class="badge"><i class="ti ti-notebook"></i></span><span style="flex:1"><b>책 10분 읽기</b><span class="rw">★2</span></span><button class="go">도전</button></div>
  <div class="pickrow"><span>내 색</span>
    <button class="chip c1 on"></button><button class="chip c2"></button><button class="chip c3"></button>
  </div>
</div></div></div>

<div><div class="cap">② 미션 — 클리어 순간(축하 연출 자리)</div>
<div class="ph"><div class="body">
  <h1>오늘의 퀘스트</h1>
  <div style="height:12px"></div>
  <div class="hooray"><span class="spark"><i>★</i><i>★</i><i>★</i><i>★</i></span>
    <b>QUEST CLEAR!</b><span>방 정리 · 별 1개 획득</span>
    <span class="stamp">CLEAR</span>
  </div>
  <div class="q"><span class="badge"><i class="ti ti-camera"></i></span><span style="flex:1"><b>저녁 양치</b><span class="rw">★1</span></span><button class="go">도전</button></div>
  <div class="q"><span class="badge"><i class="ti ti-notebook"></i></span><span style="flex:1"><b>책 10분 읽기</b><span class="rw">★2</span></span><button class="go">도전</button></div>
</div></div></div>

<div><div class="cap">③ 사진 인증</div>
<div class="ph"><div class="body">
  <h1>사진 퀘스트</h1>
  <p class="sub">저녁 양치 — 이 닦는 모습을 찍자</p>
  <div class="shot"><span class="lens"><i class="ti ti-camera"></i></span><b>눌러서 찍기</b></div>
  <button class="send">퀘스트 제출!</button>
</div></div></div>

<div><div class="cap">④ 퀘스트 지도(도장판)</div>
<div class="ph"><div class="body">
  <h1>별의 길</h1>
  <p class="sub">8월 · 별 37개</p>
  <div class="path">
    <span class="trail" style="left:76px;top:40px;height:110px"></span>
    <span class="trail" style="left:180px;top:130px;height:110px;transform:rotate(45deg)"></span>
    <span class="trail" style="left:250px;top:250px;height:100px"></span>
    <span class="node on" style="left:48px;top:8px">★</span>
    <span class="node on" style="left:140px;top:90px">★</span>
    <span class="node today" style="left:224px;top:190px">★<b>오늘 여기!</b></span>
    <span class="node" style="left:250px;top:330px">★</span>
    <span class="node" style="left:150px;top:420px">★<b>40개 — 선물!</b></span>
  </div>
  <div class="goalbox"><b>3개 더 모으면 보물상자</b><span>엄마랑 정한 선물이 열려요</span></div>
</div></div></div>

</body>
</html>
