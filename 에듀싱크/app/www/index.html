<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아이서랍</title>
<!--
  ══════════════════════════════════════════════════════════════
  앱 껍데기 1차 구조 목업 (회신25-2 승인, 2026-07-24)

  · 이 폴더(app/www)가 그대로 Capacitor 번들 자산이 된다 — 목업이 버려지지 않는다.
  · 데이터는 전부 스텁이지만 **모양은 계약(API계약-v1.md) 응답과 1:1**이다.
    나중에 fetch("/api/v1/…")로 갈아끼울 때 화면 코드는 안 바뀐다.
  · 비주얼 디자인(색·폰트 토큰)은 구조 확정 후 별도 층으로 입힌다(정본: 구조 확정 후 1회).
    지금 색은 전부 회색조 구조 표시용이다.
  · 생체 잠금·재인증·카메라는 네이티브 브리지 자리다 — UI 자리만 만들어 뒀다(정본 §4.5).
  ══════════════════════════════════════════════════════════════
-->
<!-- 고정 ?v=2는 브라우저가 옛 CSS를 계속 들고 있게 만든다(2026-07-24 실제로 겪음:
     고쳐도 화면에 안 나타남). 목업 단계에선 매번 새로 받게 한다. 배포 전에 고정 버전으로 되돌린다. -->
<!-- 선 아이콘(Tabler 웹폰트) — 이모지 대신 얇은 라인으로(2026-07-24 디자인 확정).
     2026-07-25: CDN을 걷어내고 **로컬 번들**로. 폰은 오프라인·CSP라 외부 CDN이 뜨지 않는다.
     쓰는 아이콘만 남긴 서브셋이다(fonts/README.md에 다시 만드는 법). -->
<link rel="stylesheet" href="fonts/tabler-subset.css" id="icons">
<link rel="stylesheet" href="style.css" id="css">
<!-- 목업 단계에선 CSS를 매번 새로 받는다(고정 이름이면 고쳐도 옛 파일이 돈다 — 2026-07-24·25 두 번 겪음).
     아이콘 CSS 안의 woff2 는 빌드 스크립트가 ?v=… 를 박아준다. 배포 전엔 셋 다 고정 버전으로. -->
<script>
  document.getElementById("css").href = "style.css?v=afc05818";
  document.getElementById("icons").href = "fonts/tabler-subset.css?v=aa2bfb93";
</script>
</head>
<body>
  <div id="app">
    <!-- 상단 가운데 고정 홈 버튼(2026-07-24) — 하단 탭 폐지. 홈이 아닌 화면에서만 보인다. -->
    <button id="homefab" class="hidden" onclick="location.hash='#home'" aria-label="홈"><i class="ti ti-home"></i></button>
    <!-- 화면은 app.js 라우터가 여기 그린다 -->
    <main id="screen"></main>

    <!-- 하단 탭바 **부활**(2026-08-02 시안 D). 2026-07-24에 폐지했다가 되돌린 것이다.
         가운데 ＋ 원은 빼고 다섯 칸을 고르게 둔다 — 부팅 중 그 원만 3~5초 떠 있는 문제가 있었다.
         아이콘은 폰트 글리프라 스크린리더가 사용자영역 문자를 읽어버린다 → aria-hidden 필수.
         hidden 으로 시작하는 것은 그대로 둔다(로그인 전에는 안 보여야 한다). -->
    <!-- 2026-08-02 메뉴 개편: 서식·설정은 「내정보」 안으로, 일정(달력)이 탭으로 승격 -->
    <nav id="tabbar" class="hidden" aria-label="주요 메뉴">
      <a href="#home"     data-tab="home"><i aria-hidden="true" class="ti ti-home"></i><span>홈</span></a>
      <a href="#calendar" data-tab="calendar"><i aria-hidden="true" class="ti ti-calendar"></i><span>일정</span></a>
      <a href="#mission"  data-tab="mission"><i aria-hidden="true" class="ti ti-target"></i><span>미션</span></a>
      <a href="#timeline" data-tab="timeline"><i aria-hidden="true" class="ti ti-photo"></i><span>서랍</span></a>
      <a href="#mypage"   data-tab="mypage"><i aria-hidden="true" class="ti ti-user"></i><span>내정보</span></a>
    </nav>
  </div>

  <!-- §4.5 생체 잠금 자리 — 기록(민감 영역) 첫 진입 시 덮는다. 실제 인증은 네이티브 브리지. -->
  <div id="biolock" class="overlay hidden">
    <div class="lock-card">
      <div class="lock-icon"><i class="ti ti-lock"></i></div>
      <!-- 제목·설명은 App.render() 가 상황(앱 잠금 / 기록 잠금)에 맞게 갈아끼운다 -->
      <h2 id="biolock-t">기록 잠금</h2>
      <p id="biolock-p">자녀 기록은 잠금 해제 후 볼 수 있어요.<br>지문·얼굴 또는 기기 비밀번호로 풀어요.</p>
      <button class="btn-primary" onclick="App.unlockBio()"><i class="ti ti-fingerprint"></i> 지문·얼굴로 잠금 해제</button>
    </div>
  </div>

  <!-- §4.5 재인증 자리 — 수정·삭제 직전에 올라오는 시트. 실제 확인은 네이티브 브리지 → /auth/reauth. -->
  <div id="reauth" class="overlay hidden">
    <div class="sheet">
      <h3 id="reauth-title">본인 확인</h3>
      <p id="reauth-msg"></p>
      <div class="row" id="reauth-actions"></div>
    </div>
  </div>

  <!-- 목업 안 알림(토스트) — 크롬 alert 대신. 실앱도 이 자리(화면 안 표시)를 쓴다(검수 지적 2026-07-24). -->
  <div id="toast" class="toast hidden"></div>

  <!-- CSS와 같은 이유로 캐시를 끊는다(고정 ?v=2면 고쳐도 옛 app.js가 돈다). 배포 전 고정 버전으로. -->
  <script src="app.js?v=64db2dcf"></script>
</body>
</html>
